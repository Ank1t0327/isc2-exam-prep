{id:167,domain:4,text:"What does a VPN create?",opts:["A direct physical cable between locations","An encrypted tunnel over an untrusted network","A new DNS domain","A wireless access point"],correct:1,exp:"A VPN uses tunneling and encryption to allow secure communication over untrusted networks such as the internet."},
{id:168,domain:4,text:"Why are VLANs commonly used?",opts:["To encrypt traffic automatically","To logically separate network traffic into different segments","To replace the need for routers","To provide power to devices"],correct:1,exp:"VLANs divide a physical network into logical segments, improving security and reducing unnecessary traffic exposure."},
{id:169,domain:4,text:"Which of the following is the most secure wireless security protocol?",opts:["WEP","WPA","WPA2","WPA3"],correct:3,exp:"WPA3 is the most recent and generally recommended Wi-Fi security standard, offering stronger protections than older options."},
{id:170,domain:4,text:"What is a common characteristic of a DDoS attack?",opts:["It uses only one source to attack a system","It floods a target with traffic from many sources to disrupt availability","It only targets physical servers","It uses static IP addresses only"],correct:1,exp:"DDoS attacks overwhelm targets with traffic from many distributed sources, causing service disruption or outage."},
{id:171,domain:4,text:"What is the main purpose of network segmentation?",opts:["To increase broadcast traffic","To limit lateral movement and contain the spread of compromise","To eliminate the need for access control","To replace encryption"],correct:1,exp:"Segmentation creates smaller network zones, which limits the impact of a compromise and reduces an attacker’s ability to move laterally."},
{id:172,domain:4,text:"What does NAT commonly allow in a home or business network?",opts:["Multiple devices to share one public IP address","All devices to use the same MAC address","The network to bypass DNS","Traffic to be blocked automatically"],correct:0,exp:"Network Address Translation lets multiple internal devices share one or a small number of public IP addresses."},
{id:173,domain:4,text:"Which layer of the OSI model is responsible for end-to-end delivery and reliability?",opts:["Layer 3","Layer 4","Layer 5","Layer 7"],correct:1,exp:"Layer 4, the Transport layer, is responsible for end-to-end communication, reliability, and flow control for many protocols such as TCP and UDP."},
{id:174,domain:4,text:"What type of attack intercepts traffic between two parties without their awareness?",opts:["Brute-force attack","Man-in-the-middle attack","Dictionary attack","Phishing attack"],correct:1,exp:"A man-in-the-middle attack secretly intercepts or alters communications between two parties without either one realizing it."},
{id:175,domain:4,text:"Which protocol is used to resolve hostnames to IP addresses?",opts:["DHCP","DNS","ARP","ICMP"],correct:1,exp:"DNS resolves domain names into IP addresses that computers use to reach services and hosts."},
{id:176,domain:4,text:"Why is port scanning a useful security technique?",opts:["It makes every port open","It helps identify which services and ports are exposed and potentially vulnerable","It automatically patches systems","It replaces firewalls"],correct:1,exp:"Port scanning is often used to discover which services are listening and where openings may exist that need to be secured."},
{id:177,domain:4,text:"What is a common purpose of an IDS?",opts:["To block all traffic by default","To monitor traffic and generate alerts about suspicious activity","To provide DHCP leases","To physically secure a server room"],correct:1,exp:"An intrusion detection system monitors network or host activity and raises alerts when suspicious behavior is observed."},
{id:178,domain:4,text:"Which form of attack tries to guess passwords by trying many common combinations?",opts:["Phishing","Brute-force attack","Tailgating","Spoofing"],correct:1,exp:"A brute-force attack repeatedly tries candidate passwords until one succeeds or the attempt is blocked."},
{id:179,domain:4,text:"What is the purpose of a wireless access point’s SSID?",opts:["To identify the network name broadcast to clients","To provide an IP address","To encrypt all data","To authenticate users physically"],correct:0,exp:"The SSID is the network name that clients see and can connect to, though it should not be the only security control."},
{id:180,domain:4,text:"Which of the following best describes a bastion host?",opts:["A host that is intentionally hardened and exposed to the internet to provide a controlled service","A backup server in the cloud","A user workstation with no security controls","A physical lock used on a server cabinet"],correct:0,exp:"A bastion host is a specially secured system exposed to potentially hostile networks to provide a controlled service such as remote access or a proxy."},
{id:181,domain:5,text:"What is the primary function of encryption?",opts:["To create a permanent backup","To make data unreadable to unauthorized parties and reversible by authorized parties","To improve CPU speed","To monitor user behavior"],correct:1,exp:"Encryption transforms data into a form that cannot be read without the proper key, protecting it from unauthorized disclosure."},
{id:182,domain:5,text:"Which statement best distinguishes hashing from encryption?",opts:["Hashing is reversible and encryption is not","Hashing creates a fixed-length digest that is not intended to be reversed, encryption is intended to be reversible","Hashing requires a private key and encryption does not","Hashing is only used for passwords"],correct:1,exp:"Hashing produces a one-way representation of data used for integrity and comparison, while encryption is designed to be reversed with the proper key."},
{id:183,domain:5,text:"What is the purpose of data classification?",opts:["To assign hardware serial numbers","To identify the sensitivity of data so appropriate protection can be applied","To decide which users need laptops","To determine the number of backup tapes"],correct:1,exp:"Data classification helps organizations apply appropriate controls based on the sensitivity and value of the information."},
{id:184,domain:5,text:"What is system hardening intended to achieve?",opts:["To increase system performance only","To reduce the attack surface by removing unnecessary services and locking down settings","To create more user accounts","To eliminate the need for logging"],correct:1,exp:"Hardening reduces the number of potential weaknesses in a system by disabling unnecessary features and applying secure settings."},
{id:185,domain:5,text:"Why is patch management important?",opts:["It increases the number of installed applications","It closes known vulnerabilities and reduces the chance of exploitation","It reduces the need for physical security","It guarantees no user mistakes"],correct:1,exp:"Patch management applies updates that fix known security issues, which lowers exposure to known threats and vulnerabilities."},
{id:186,domain:5,text:"What is the main purpose of a change management process?",opts:["To allow any user to change systems freely","To ensure changes are reviewed, approved, and documented before implementation","To replace antivirus tools","To prevent all downtime"],correct:1,exp:"Change management controls modifications so that changes are tested, approved, and documented, reducing risk to systems and services."},
{id:187,domain:5,text:"What does a SIEM system primarily do?",opts:["It stores backup data only","It aggregates and analyzes logs from multiple systems to detect security events","It replaces endpoint protection","It physically secures the server room"],correct:1,exp:"A SIEM correlates logs and events from many sources so security teams can detect suspicious patterns and investigate incidents."},
{id:188,domain:5,text:"What is a common purpose of endpoint detection and response tools?",opts:["To provide legal advice to staff","To detect, investigate, and respond to suspicious activity on endpoints","To replace cloud backups","To assign IP addresses"],correct:1,exp:"EDR solutions monitor endpoints for suspicious behavior and help security teams investigate and contain threats quickly."},
{id:189,domain:5,text:"Which of the following is a common social engineering technique?",opts:["Phishing","ARP spoofing","Port scanning","Brute force"],correct:0,exp:"Phishing is a social engineering method that tricks people into revealing information or taking actions that compromise security."},
{id:190,domain:5,text:"What is the best description of a security baseline?",opts:["A random set of settings","A documented minimum secure configuration for a system","A list of users who need access","A backup retention schedule"],correct:1,exp:"A baseline is the standardized secure configuration a system should follow, helping ensure consistent protection and easier auditing."},
{id:191,domain:5,text:"What is the purpose of logging and monitoring?",opts:["To reduce storage capacity needs","To create an audit trail and help detect suspicious activity","To replace patching","To prevent user training"],correct:1,exp:"Logs and monitoring provide visibility into system and user activity, making suspicious behavior easier to detect and investigate."},
{id:192,domain:5,text:"What is the objective of vulnerability scanning?",opts:["To create user passwords","To identify weaknesses that may need remediation","To replace antivirus software","To control access to the building"],correct:1,exp:"Vulnerability scanning helps find systems and software weaknesses that may need patching, configuration changes, or other remediation."},
{id:193,domain:5,text:"Why is least privilege important in operational security?",opts:["It allows every user to act as an administrator","It limits the impact of accidents, misuse, and compromise","It makes systems easier to break","It eliminates the need for monitoring"],correct:1,exp:"Least privilege reduces the chance and impact of accidental or malicious actions by limiting access to what is truly necessary."},
{id:194,domain:5,text:"What is the purpose of a backup strategy?",opts:["To automatically delete old files","To preserve data and support recovery after loss, damage, or corruption","To replace firewalls","To authenticate users"],correct:1,exp:"Backups are essential for recovering data and systems when files are lost, damaged, or affected by malware or disasters."},
{id:195,domain:5,text:"Which security control is most likely to help after a malware infection has already begun?",opts:["A preventive firewall rule","An antivirus or endpoint response tool that detects and removes the malware","A password policy","A visible security camera"],correct:1,exp:"Antivirus and endpoint response tools can detect and remove malware once it is present, helping reduce impact and spread."},
{id:196,domain:5,text:"What does data in use refer to?",opts:["Data being actively processed by a system","Data stored on a disk","Data traveling over a network","Data archived in a vault"],correct:0,exp:"Data in use is information that is being processed in memory or by an application, which requires different protections than stored or transmitted data."},
{id:197,domain:5,text:"What is the primary purpose of a security incident ticket?",opts:["To replace the need for evidence","To track the status, ownership, and actions related to an incident","To generate passwords","To install software updates"],correct:1,exp:"Incident tickets organize response work, track ownership, and help ensure that actions are completed and documented."},
{id:198,domain:5,text:"Which statement best describes malware?",opts:["A type of firewall rule","Malicious software designed to harm, steal, or disrupt systems","A backup archive format","A network routing protocol"],correct:1,exp:"Malware is any malicious software created to compromise systems, steal information, or disrupt business operations."},
{id:199,domain:5,text:"Why is employee security awareness training important even when technical controls are strong?",opts:["Because people are often the weakest link and can be tricked into risky actions","Because training can replace all technical controls","Because employees should never use passwords","Because technical controls do not need monitoring"],correct:0,exp:"Users are often targeted through social engineering, so awareness training is essential even when strong technical protections are in place."},

var PRACTICE_TEST_SIZE = 100;
var PRACTICE_TESTS = 4;
var PRACTICE_TEST_DOMAIN_COUNTS = {
  1: 26,
  2: 10,
  3: 22,
  4: 24,
  5: 18
};

function rotateOptions(opts, offset){
  var rotated = opts.slice();
  var shift = offset % rotated.length;
  if (shift < 0) shift += rotated.length;
  return rotated.slice(shift).concat(rotated.slice(0, shift));
}

function buildQuestionVariants(baseQuestions){
  var variants = [];
  var styles = [
    function(text){ return text; },
    function(text){ return 'In practice, ' + text; },
    function(text){ return 'For review, ' + text; },
    function(text){ return 'When applying this concept, ' + text; }
  ];

  baseQuestions.forEach(function(q){
    var questionVariants = styles.map(function(style, styleIndex){
      var copy = {};
      for (var key in q) copy[key] = q[key];
      copy.baseId = q.id;
      copy.id = Number(q.id) * 10 + styleIndex + 1;
      copy.variantId = copy.id;
      copy.text = style(q.text);
      copy.opts = rotateOptions(q.opts, styleIndex + 1);
      copy.correct = copy.opts.indexOf(q.opts[q.correct]);
      return copy;
    });
    variants.push(questionVariants);
  });

  return variants;
}

var QUESTION_VARIANTS = buildQuestionVariants(QUESTIONS);

var state = {
  screen: 'home',
  queue: [],
  idx: 0,
  selected: null,
  answered: false,
  sessionLog: [],
  progress: {}
};

function domainOf(id){
  for (var i=0;i<DOMAINS.length;i++){ if (DOMAINS[i].id===id) return DOMAINS[i]; }
  return null;
}

function domainStats(domainId){
  var seen=0, correct=0;
  for (var i=0;i<QUESTIONS.length;i++){
    var q = QUESTIONS[i];
    if (q.domain!==domainId) continue;
    var p = state.progress[q.id];
    if (p){ seen+=p.seen; correct+=p.correct; }
  }
  return { seen: seen, correct: correct, pct: seen ? Math.round(100*correct/seen) : 0 };
}

function overallStats(){
  var seen=0, correct=0;
  for (var key in state.progress){
    var p = state.progress[key];
    seen+=p.seen; correct+=p.correct;
  }
  return { seen: seen, correct: correct, pct: seen ? Math.round(100*correct/seen) : 0 };
}

function missedPool(){
  return QUESTIONS.filter(function(q){
    var p = state.progress[q.id];
    return p && p.lastWrong;
  });
}

function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function prep(q){
  var options = q.opts.map(function(text, index){
    return {text:text, index:index};
  });

  var shuffled = shuffle(options);
  var correctOption = shuffled.find(function(item){
    return item.index === q.correct;
  });

  if (correctOption){
    var longestIndex = -1;
    var longestLength = -1;
    shuffled.forEach(function(item, index){
      if (item.text.length > longestLength){
        longestLength = item.text.length;
        longestIndex = index;
      }
    });

    if (shuffled[longestIndex] && shuffled[longestIndex].index === q.correct){
      var swapTarget = -1;
      for (var i=0;i<shuffled.length;i++){
        if (shuffled[i].index !== q.correct && shuffled[i].text.length < longestLength){
          swapTarget = i;
          break;
        }
      }
      if (swapTarget !== -1){
        var tmp = shuffled[longestIndex];
        shuffled[longestIndex] = shuffled[swapTarget];
        shuffled[swapTarget] = tmp;
      }
    }
  }

  var opts = shuffled.map(function(item){ return item.text; });
  var correct = shuffled.findIndex(function(item){ return item.index === q.correct; });
  var copy = {};
  for (var key in q) copy[key]=q[key];
  copy.opts = opts;
  copy.correct = correct;
  return copy;
}

function buildPracticeTest(testVariant){
  var variantIndex = (testVariant - 1) % 4;
  var selected = QUESTION_VARIANTS.map(function(variants){ return variants[variantIndex]; });
  return shuffle(selected).slice(0, PRACTICE_TEST_SIZE).map(prep);
}

function startSet(mode, domainId, testVariant){
  var pool;
  if (mode==='mock') pool = QUESTIONS;
  else if (mode==='domain') pool = QUESTIONS.filter(function(q){ return q.domain===domainId; });
  else pool = missedPool();
  if (!pool.length) return;

  var testPool = pool;
  if (mode==='mock'){
    testPool = buildPracticeTest(testVariant || 1);
  }

  state.queue = testPool.map(prep);
  state.idx = 0;
  state.selected = null;
  state.answered = false;
  state.sessionLog = [];
  state.screen = 'quiz';
  render();
}

function selectOption(i){
  if (state.answered) return;
  var q = state.queue[state.idx];
  state.selected = i;
  state.answered = true;
  var isCorrect = (i===q.correct);
  var p = state.progress[q.id] || {seen:0, correct:0, lastWrong:false};
  p.seen++;
  if (isCorrect){ p.correct++; p.lastWrong=false; } else { p.lastWrong=true; }
  state.progress[q.id] = p;
  state.sessionLog.push({id:q.id, domain:q.domain, correct:isCorrect});
  saveProgress();
  render();
}

function nextQuestion(){
  if (state.idx+1 >= state.queue.length){
    state.screen = 'results';
  } else {
    state.idx++;
    state.selected = null;
    state.answered = false;
  }
  render();
}

function goHome(){
  state.screen='home';
  render();
}

async function loadProgress(){
  try {
    var res = await window.storage.get('cc-progress', false);
    if (res && res.value) state.progress = JSON.parse(res.value);
  } catch (e) {
    state.progress = {};
  }
}

async function saveProgress(){
  try {
    await window.storage.set('cc-progress', JSON.stringify(state.progress), false);
  } catch (e) {
    console.error('progress save failed', e);
  }
}

function setPath(p){
  var el = document.getElementById('termPath');
  if (el) el.textContent = 'patch@cc-exam:~$ ' + p;
}

function renderHome(){
  setPath('./start_prep.sh');
  var missed = missedPool();
  var overall = overallStats();
  var rows = DOMAINS.map(function(d){
    var st = domainStats(d.id);
    var acc = st.seen ? (st.pct + '%') : '';
    return '<button class="domain-row" data-action="start-domain" data-domain="'+d.id+'">' +
      '<span class="d-idx">0'+d.id+'</span>' +
      '<span class="d-name">'+d.name+'</span>' +
      '<span class="d-bar-track"><span class="d-bar-fill" data-fill="'+d.weight+'"></span></span>' +
      '<span class="d-weight">'+d.weight+'%</span>' +
      '<span class="d-acc">'+acc+'</span>' +
    '</button>';
  }).join('');

  var lifetime = overall.seen ? ('<div class="stat-line">lifetime: '+overall.correct+'/'+overall.seen+' correct ('+overall.pct+'%) &middot; percentages on the right show your accuracy per domain</div>') : '';

  return '' +
    '<div class="eyebrow">isc2 &middot; certified in cybersecurity</div>' +
    '<h1 class="title">exam_outline.conf<span class="cursor"></span></h1>' +
    '<p class="subtitle">Four 100-question practice tests, structured to mirror the ISC2 CC exam format and domain weighting.</p>' +
    rows +
    '<div class="hint">click a domain to drill it individually, or launch one of the four full-length practice tests below</div>' +
    '<div class="btn-row">' +
      '<button class="btn primary" data-action="start-mock" data-test-id="1">practice test 1 &mdash; 100q</button>' +
      '<button class="btn primary" data-action="start-mock" data-test-id="2">practice test 2 &mdash; 100q</button>' +
      '<button class="btn primary" data-action="start-mock" data-test-id="3">practice test 3 &mdash; 100q</button>' +
      '<button class="btn primary" data-action="start-mock" data-test-id="4">practice test 4 &mdash; 100q</button>' +
      '<button class="btn" data-action="start-missed" '+(missed.length? '':'disabled')+'>review missed ('+missed.length+')</button>' +
    '</div>' +
    lifetime;
}

function renderQuiz(){
  var q = state.queue[state.idx];
  var d = domainOf(q.domain);
  setPath('./quiz --domain='+d.slug);
  var total = state.queue.length;
  var letters = ['A','B','C','D'];

  var optsHtml = q.opts.map(function(opt,i){
    var cls = 'opt';
    var tag = '';
    if (state.answered){
      if (i===q.correct){ cls+=' correct'; tag='<span class="tag">[ OK ]</span>'; }
      else if (i===state.selected){ cls+=' wrong'; tag='<span class="tag">[FAIL]</span>'; }
    }
    return '<button class="'+cls+'" data-action="select-option" data-index="'+i+'" '+(state.answered?'disabled':'')+'>' +
      '<span class="k">'+letters[i]+'</span><span class="opt-text">'+opt+'</span>'+tag+
    '</button>';
  }).join('');

  var explain = '';
  if (state.answered){
    var verdict = (state.selected===q.correct) ? 'correct.' : 'not quite.';
    explain = '<div class="explain"><b>'+verdict+'</b> '+q.exp+'</div>';
  }

  var isLast = (state.idx+1 >= total);
  var footer = '<div class="footer-row"><button class="link-btn" data-action="home">quit to menu</button>';
  if (state.answered){
    footer += '<button class="btn primary" data-action="next">'+(isLast?'see results &rarr;':'next question &rarr;')+'</button>';
  }
  footer += '</div>';

  return '' +
    '<div class="qmeta"><span>q '+(state.idx+1)+'/'+total+'</span><span>0'+d.id+' '+d.slug+'</span></div>' +
    '<div class="qprogress-track"><div class="qprogress-fill" style="width:'+Math.round(100*state.idx/total)+'%"></div></div>' +
    '<div class="qtext">'+q.text+'</div>' +
    optsHtml +
    explain +
    footer;
}

function renderResults(){
  setPath('./quiz --report');
  var total = state.sessionLog.length;
  var correctCount = state.sessionLog.filter(function(r){ return r.correct; }).length;
  var pct = total ? Math.round(100*correctCount/total) : 0;

  var byDomain = {};
  state.sessionLog.forEach(function(r){
    if (!byDomain[r.domain]) byDomain[r.domain] = {seen:0, correct:0};
    byDomain[r.domain].seen++;
    if (r.correct) byDomain[r.domain].correct++;
  });
  var rows = Object.keys(byDomain).map(function(dId){
    var d = domainOf(Number(dId));
    var s = byDomain[dId];
    var p = Math.round(100*s.correct/s.seen);
    return '<div class="domain-stat-row">' +
      '<span class="d-idx">0'+d.id+'</span>' +
      '<span class="d-name">'+d.name+'</span>' +
      '<span class="d-bar-track"><span class="d-bar-fill" style="width:'+p+'%"></span></span>' +
      '<span class="d-weight">'+p+'%</span>' +
    '</div>';
  }).join('');

  var missedThisSession = total - correctCount;

  return '' +
    '<div class="eyebrow">session complete</div>' +
    '<div class="score-big">'+correctCount+'/'+total+'</div>' +
    '<div class="score-sub">'+pct+'% correct this session</div>' +
    rows +
    '<div class="btn-row">' +
      (missedThisSession ? '<button class="btn" data-action="start-missed">review missed ('+missedPool().length+')</button>' : '') +
      '<button class="btn primary" data-action="home">back to menu</button>' +
    '</div>';
}

function render(){
  var app = document.getElementById('app');
  if (state.screen==='home'){
    app.innerHTML = renderHome();
    requestAnimationFrame(function(){
      document.querySelectorAll('.d-bar-fill[data-fill]').forEach(function(el){
        el.style.width = el.getAttribute('data-fill') + '%';
      });
    });
  } else if (state.screen==='quiz'){
    app.innerHTML = renderQuiz();
  } else {
    app.innerHTML = renderResults();
  }
}

document.getElementById('app').addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute('data-action');
  if (action==='start-mock') startSet('mock', null, Number(btn.getAttribute('data-test-id')) || 1);
  else if (action==='start-domain') startSet('domain', Number(btn.getAttribute('data-domain')));
  else if (action==='start-missed') startSet('missed');
  else if (action==='select-option') selectOption(Number(btn.getAttribute('data-index')));
  else if (action==='next') nextQuestion();
  else if (action==='home') goHome();
});

loadProgress().then(render);
</script>
</body>
</html>
